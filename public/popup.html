<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CaptchaLens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>CaptchaLens</h1>
        <span id="count" class="count"></span>

      <button id="solve" class="solve-btn">Solve challenge</button>
      <div id="solve-status" class="solve-status"></div>

        <span id="engine-info" class="engine-info"></span>
        <button id="open-settings" class="settings-link">settings</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
